# AI 플레이어 인격 풀. 게임마다 AI 좌석 수만큼 무작위로 뽑고, 역할과는 독립적으로 배정합니다.
# 이름은 채팅에서 유일한 식별자이므로 첫 글자가 겹치지 않게 유지하세요.
# 필드: name, age, occupation, personality, speech_style, trust (낮음/보통/높음),
#       deception (거짓말 실력: 서툼/보통/능숙), talkativeness (과묵/보통/수다), quirks, sample_lines
# 모두 20~30대이고, 말투는 또래끼리 하는 온라인 채팅 기준입니다(공통 규칙: views/seat_text.py의 ORIGINAL_VOICE).
# 성격 차이는 나이나 격식이 아니라 말의 리듬과 버릇으로 드러내세요. 하십시오체·연설체·속담은 쓰지 않습니다.

