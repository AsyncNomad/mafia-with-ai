[project]
name = "mafia"
version = "0.1.0"
description = "8-player social deduction game (mafia / murder mystery) played with isolated AI agents inside a coding-agent harness"
readme = "README.md"
authors = [{ name = "AsyncNomad" }]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.10",
    "pydantic>=2.8",
]

[project.scripts]
mafia = "mafia.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "import-linter>=2.15",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Line length is enforced by the formatter; long Korean message strings are left intact.
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "mafia"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Engine and modes are pure (no I/O layers, no host adapters)"
type = "forbidden"
source_modules = ["mafia.engine", "mafia.modes"]
forbidden_modules = [
    "mafia.store",
    "mafia.service",
    "mafia.hosts",
    "mafia.harness",
    "mafia.cli",
    "mcp",
]

[[tool.importlinter.contracts]]
name = "Engine does not depend on any concrete mode"
type = "forbidden"
source_modules = ["mafia.engine"]
forbidden_modules = ["mafia.modes"]

[[tool.importlinter.contracts]]
name = "Host-neutral harness contract does not depend on a host"
type = "forbidden"
source_modules = ["mafia.harness"]
forbidden_modules = ["mafia.hosts"]
