[project]
name = "mafia"
version = "0.1.0"
description = "8-player social deduction game (mafia / murder mystery) played with isolated AI agents inside a coding-agent harness"
readme = "README.md"
authors = [{ name = "AsyncNomad" }]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.10",
    "pydantic>=2.8",
]

[project.scripts]
mafia = "mafia.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
